<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Measuring one object · Vanilla Sphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0d0b08;
      --color-ink:     #efebe4;
      --color-muted:   #afaaa3;
      --color-accent:  #f97c3d;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
      color-scheme: dark;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Vanilla Sphere</p>
    <h1>Measuring one object</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 852" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="measurement-pipeline-dark-title measurement-pipeline-dark-desc">
        <title id="measurement-pipeline-dark-title">Measuring one object</title>
        <desc id="measurement-pipeline-dark-desc">Flowchart showing predicted positions and native stamps feeding a PSF fit whose outcome selects single-exposure detections, a co-moving stack or a wing fit, followed by the track fit and the light curve.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#afaaa3"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f97c3d"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6db0f4"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#0d0b08"/>

        <!-- Connectors (behind the nodes) -->
        <path d="M 392,64 H 288 Q 280,64 280,72 V 120" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 568,64 H 672 Q 680,64 680,72 V 120" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 280,200 V 264 Q 280,272 288,272 H 376" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 680,200 V 264 Q 680,272 672,272 H 584" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="304" x2="480" y2="336" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 392,376 H 176 Q 168,376 168,384 V 472" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="416" x2="480" y2="472" fill="none" stroke="#f97c3d" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 568,376 H 784 Q 792,376 792,384 V 472" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="536" x2="480" y2="592" fill="none" stroke="#f97c3d" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 168,536 V 616 Q 168,624 176,624 H 376" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 740,536 V 616 Q 740,624 732,624 H 584" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="844" y1="536" x2="844" y2="696" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 584,504 H 628 Q 636,504 636,512 V 616 a 8,8 0 0,0 0,16 V 704 Q 636,712 644,712 H 688" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="656" x2="480" y2="704" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="688" y1="728" x2="568" y2="728" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Connector labels -->
        <rect x="250" y="356" width="60" height="12" rx="2" fill="#0d0b08"/>
        <text x="280.0" y="365" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOO FAINT</text>
        <rect x="488" y="438" width="52" height="12" rx="2" fill="#0d0b08"/>
        <text x="514.0" y="447" fill="#f97c3d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DETECTED</text>
        <rect x="636" y="356" width="88" height="12" rx="2" fill="#0d0b08"/>
        <text x="680.0" y="365" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CORE SATURATED</text>

        <!-- Nodes -->
        <rect x="392" y="40" width="176" height="48" rx="24" fill="#0d0b08"/>
        <rect x="392" y="40" width="176" height="48" rx="24" fill="rgba(175,170,163,0.10)" stroke="#908b84" stroke-width="1"/>
        <text x="480.0" y="62.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Target</text>
        <text x="480.0" y="78.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">name or position</text>
        <rect x="176" y="120" width="208" height="80" rx="6" fill="#0d0b08"/>
        <rect x="176" y="120" width="208" height="80" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="280.0" y="152.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Predicted positions</text>
        <text x="280.0" y="168.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Gaia DR3 or literature</text>
        <text x="280.0" y="181.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">proper motion + parallax</text>
        <rect x="576" y="120" width="208" height="80" rx="6" fill="#0d0b08"/>
        <rect x="576" y="120" width="208" height="80" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="680.0" y="152.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Native stamps</text>
        <text x="680.0" y="168.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">49 x 81 px per exposure</text>
        <text x="680.0" y="181.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">by range request</text>
        <rect x="376" y="240" width="208" height="64" rx="6" fill="#0d0b08"/>
        <rect x="376" y="240" width="208" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="480.0" y="270.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">PSF fit</text>
        <text x="480.0" y="286.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">with Gaia neighbours</text>
        <polygon points="480,336 568,376 480,416 392,376" fill="#0d0b08"/>
        <polygon points="480,336 568,376 480,416 392,376" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="480" y="380" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Outcome</text>
        <rect x="64" y="472" width="208" height="64" rx="6" fill="#0d0b08"/>
        <rect x="64" y="472" width="208" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="168.0" y="502.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Co-moving stack</text>
        <text x="168.0" y="518.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">per pass and detector</text>
        <rect x="376" y="472" width="208" height="64" rx="6" fill="#0d0b08"/>
        <rect x="376" y="472" width="208" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="480.0" y="502.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Detections</text>
        <text x="480.0" y="518.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">single exposure</text>
        <rect x="688" y="472" width="208" height="64" rx="6" fill="#0d0b08"/>
        <rect x="688" y="472" width="208" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="792.0" y="502.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Wing fit</text>
        <text x="792.0" y="518.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Moffat profile, ring flux</text>
        <rect x="376" y="592" width="208" height="64" rx="6" fill="#0d0b08"/>
        <rect x="376" y="592" width="208" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="480.0" y="622.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Track fit</text>
        <text x="480.0" y="638.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">outlier rejection, jackknife</text>
        <rect x="688" y="696" width="208" height="64" rx="6" fill="#0d0b08"/>
        <rect x="688" y="696" width="208" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="792.0" y="726.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Light curve</text>
        <text x="792.0" y="742.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">flux / mean spectrum</text>
        <rect x="392" y="704" width="176" height="48" rx="24" fill="#0d0b08"/>
        <rect x="392" y="704" width="176" height="48" rx="24" fill="rgba(239,235,228,0.05)" stroke="#afaaa3" stroke-width="1"/>
        <text x="480.0" y="726.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Result</text>
        <text x="480.0" y="742.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQLite + Postgres</text>

        <!-- Legend and notes -->
        <line x1="40" y1="792" x2="920" y2="792" stroke="rgba(239,235,228,0.10)" stroke-width="0.8"/>
        <text x="40" y="808" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="824" width="14" height="10" rx="2" fill="rgba(175,170,163,0.10)" stroke="#908b84" stroke-width="1"/>
        <text x="60" y="832" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Start</text>
        <rect x="112" y="824" width="14" height="10" rx="2" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="132" y="832" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Step or decision</text>
        <rect x="240" y="824" width="14" height="10" rx="2" fill="rgba(239,235,228,0.05)" stroke="#afaaa3" stroke-width="1"/>
        <text x="260" y="832" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Stored result</text>
        <line x1="352" y1="830" x2="380" y2="830" stroke="#f97c3d" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="388" y="832" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Usual path</text>
        <line x1="464" y1="830" x2="492" y2="830" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="500" y="832" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Other paths</text>
      </svg>
    </div>
  </div>
</body>
</html>
