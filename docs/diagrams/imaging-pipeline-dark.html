<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From a position to pixels · Vanilla Sphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0d0b08;
      --color-ink:     #efebe4;
      --color-muted:   #afaaa3;
      --color-accent:  #b58afb;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
      color-scheme: dark;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Vanilla Sphere</p>
    <h1>From a position to pixels</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 332" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="imaging-pipeline-dark-title imaging-pipeline-dark-desc">
        <title id="imaging-pipeline-dark-title">From a position to pixels</title>
        <desc id="imaging-pipeline-dark-desc">Flow diagram showing a request turned into a grid, an exposure search, range reads, cleaning and resampling, the frame cache, epochs and the encoded output.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#afaaa3"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b58afb"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6cd7e3"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#0d0b08"/>

        <!-- Connectors (behind the nodes) -->
        <line x1="216" y1="72" x2="272" y2="72" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="448" y1="72" x2="504" y2="72" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="680" y1="72" x2="736" y2="72" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="216" y1="208" x2="272" y2="208" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="448" y1="208" x2="504" y2="208" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="680" y1="208" x2="736" y2="208" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 824,104 V 132 Q 824,140 816,140 H 136 Q 128,140 128,148 V 176" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Nodes -->
        <rect x="40" y="40" width="176" height="64" rx="6" fill="#0d0b08"/>
        <rect x="40" y="40" width="176" height="64" rx="6" fill="rgba(175,170,163,0.10)" stroke="#908b84" stroke-width="1"/>
        <rect x="48" y="48" width="24" height="12" rx="2" fill="transparent" stroke="rgba(144,139,132,0.40)" stroke-width="0.8"/>
        <text x="60.0" y="57" fill="#908b84" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
        <text x="128.0" y="76.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Request</text>
        <text x="128.0" y="92.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">position, field of view</text>
        <rect x="272" y="40" width="176" height="64" rx="6" fill="#0d0b08"/>
        <rect x="272" y="40" width="176" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <rect x="280" y="48" width="24" height="12" rx="2" fill="transparent" stroke="rgba(239,235,228,0.40)" stroke-width="0.8"/>
        <text x="292.0" y="57" fill="#efebe4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
        <text x="360.0" y="76.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Grid</text>
        <text x="360.0" y="92.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">north-up TAN</text>
        <rect x="504" y="40" width="176" height="64" rx="6" fill="#0d0b08"/>
        <rect x="504" y="40" width="176" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <rect x="512" y="48" width="24" height="12" rx="2" fill="transparent" stroke="rgba(239,235,228,0.40)" stroke-width="0.8"/>
        <text x="524.0" y="57" fill="#efebe4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
        <text x="592.0" y="76.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Exposure search</text>
        <text x="592.0" y="92.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IRSA SIA v2</text>
        <rect x="736" y="40" width="176" height="64" rx="6" fill="#0d0b08"/>
        <rect x="736" y="40" width="176" height="64" rx="6" fill="rgba(181,138,251,0.10)" stroke="#b58afb" stroke-width="1"/>
        <rect x="744" y="48" width="24" height="12" rx="2" fill="transparent" stroke="rgba(181,138,251,0.50)" stroke-width="0.8"/>
        <text x="756.0" y="57" fill="#b58afb" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
        <text x="824.0" y="76.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Range reads</text>
        <text x="824.0" y="92.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 requests per exposure</text>
        <rect x="40" y="176" width="176" height="64" rx="6" fill="#0d0b08"/>
        <rect x="40" y="176" width="176" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <rect x="48" y="184" width="24" height="12" rx="2" fill="transparent" stroke="rgba(239,235,228,0.40)" stroke-width="0.8"/>
        <text x="60.0" y="193" fill="#efebe4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
        <text x="128.0" y="212.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Clean and resample</text>
        <text x="128.0" y="228.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mask, sky plane, bilinear</text>
        <rect x="272" y="176" width="176" height="64" rx="6" fill="#0d0b08"/>
        <rect x="272" y="176" width="176" height="64" rx="6" fill="rgba(239,235,228,0.05)" stroke="#afaaa3" stroke-width="1"/>
        <rect x="280" y="184" width="24" height="12" rx="2" fill="transparent" stroke="rgba(175,170,163,0.50)" stroke-width="0.8"/>
        <text x="292.0" y="193" fill="#afaaa3" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">06</text>
        <text x="360.0" y="212.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Frame cache</text>
        <text x="360.0" y="228.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQLite on disk</text>
        <rect x="504" y="176" width="176" height="64" rx="6" fill="#0d0b08"/>
        <rect x="504" y="176" width="176" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <rect x="512" y="184" width="24" height="12" rx="2" fill="transparent" stroke="rgba(239,235,228,0.40)" stroke-width="0.8"/>
        <text x="524.0" y="193" fill="#efebe4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">07</text>
        <text x="592.0" y="212.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Epochs</text>
        <text x="592.0" y="228.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">exposure, day, sky pass</text>
        <rect x="736" y="176" width="176" height="64" rx="6" fill="#0d0b08"/>
        <rect x="736" y="176" width="176" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <rect x="744" y="184" width="24" height="12" rx="2" fill="transparent" stroke="rgba(239,235,228,0.40)" stroke-width="0.8"/>
        <text x="756.0" y="193" fill="#efebe4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">08</text>
        <text x="824.0" y="212.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Colour and encode</text>
        <text x="824.0" y="228.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cube, PNG, GIF</text>

        <!-- Legend and notes -->
        <line x1="40" y1="272" x2="920" y2="272" stroke="rgba(239,235,228,0.10)" stroke-width="0.8"/>
        <text x="40" y="288" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="304" width="14" height="10" rx="2" fill="rgba(175,170,163,0.10)" stroke="#908b84" stroke-width="1"/>
        <text x="60" y="312" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Input</text>
        <rect x="112" y="304" width="14" height="10" rx="2" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="132" y="312" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Step</text>
        <rect x="180" y="304" width="14" height="10" rx="2" fill="rgba(181,138,251,0.10)" stroke="#b58afb" stroke-width="1"/>
        <text x="200" y="312" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Only bytes that are needed</text>
        <rect x="352" y="304" width="14" height="10" rx="2" fill="rgba(239,235,228,0.05)" stroke="#afaaa3" stroke-width="1"/>
        <text x="372" y="312" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Cache</text>
      </svg>
    </div>
  </div>
</body>
</html>
