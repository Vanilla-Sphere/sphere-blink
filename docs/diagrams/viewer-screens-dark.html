<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screens and modes of the viewer · Vanilla Sphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0d0b08;
      --color-ink:     #efebe4;
      --color-muted:   #afaaa3;
      --color-accent:  #b58afb;
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
      color-scheme: dark;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Vanilla Sphere</p>
    <h1>Screens and modes of the viewer</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="viewer-screens-dark-title viewer-screens-dark-desc">
        <title id="viewer-screens-dark-title">Screens and modes of the viewer</title>
        <desc id="viewer-screens-dark-desc">State diagram showing the sky map screen and the view screen, how the address chooses between them, and the Simple and Advanced modes inside the view screen.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#afaaa3"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b58afb"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6cd7e3"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#0d0b08"/>

        <!-- Zones and lifelines -->
        <rect x="520" y="96" width="400" height="208" rx="8" fill="rgba(181,138,251,0.10)" stroke="#b58afb" stroke-width="1"/>
        <rect x="528" y="104" width="40" height="12" rx="2" fill="transparent" stroke="rgba(181,138,251,0.50)" stroke-width="0.8"/>
        <text x="548" y="113" fill="#b58afb" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="544" y="140" fill="#efebe4" font-size="14" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif">View screen</text>
        <text x="544" y="156" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">data-screen=view</text>

        <!-- Connectors (behind the nodes) -->
        <line x1="70" y1="192" x2="176" y2="192" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 64,198 V 272 Q 64,280 72,280 H 520" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="352" y1="176" x2="520" y2="176" fill="none" stroke="#b58afb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="520" y1="208" x2="352" y2="208" fill="none" stroke="#afaaa3" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 680,96 V 72 Q 680,64 688,64 H 752 Q 760,64 760,72 V 96" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="688" y1="204" x2="752" y2="204" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="752" y1="228" x2="688" y2="228" fill="none" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Connector labels -->
        <rect x="89" y="172" width="68" height="12" rx="2" fill="#0d0b08"/>
        <text x="123.0" y="181" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO POSITION</text>
        <rect x="228" y="260" width="128" height="12" rx="2" fill="#0d0b08"/>
        <text x="292.0" y="269" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ADDRESS HAS A POSITION</text>
        <rect x="398" y="156" width="76" height="12" rx="2" fill="#0d0b08"/>
        <text x="436.0" y="165" fill="#b58afb" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PICK A PLACE</text>
        <rect x="396" y="216" width="80" height="12" rx="2" fill="#0d0b08"/>
        <text x="436.0" y="225" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SKY MAP, BACK</text>
        <rect x="768" y="58" width="136" height="12" rx="2" fill="#0d0b08"/>
        <text x="836.0" y="67" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RECENTRE, FIELD, SEARCH</text>
        <rect x="698" y="184" width="44" height="12" rx="2" fill="#0d0b08"/>
        <text x="720.0" y="193" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SWITCH</text>
        <rect x="698" y="236" width="44" height="12" rx="2" fill="#0d0b08"/>
        <text x="720.0" y="245" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SWITCH</text>

        <!-- Nodes -->
        <circle cx="64" cy="192" r="6" fill="#efebe4"/>
        <rect x="176" y="152" width="176" height="80" rx="8" fill="#0d0b08"/>
        <rect x="176" y="152" width="176" height="80" rx="8" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <rect x="184" y="160" width="36" height="12" rx="2" fill="transparent" stroke="rgba(239,235,228,0.40)" stroke-width="0.8"/>
        <text x="202.0" y="169" fill="#efebe4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="264.0" y="196.0" fill="#efebe4" font-size="14" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Sky map</text>
        <text x="264.0" y="212.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">data-screen=map</text>
        <rect x="544" y="184" width="144" height="64" rx="6" fill="#0d0b08"/>
        <rect x="544" y="184" width="144" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <rect x="552" y="192" width="32" height="12" rx="2" fill="transparent" stroke="rgba(239,235,228,0.40)" stroke-width="0.8"/>
        <text x="568.0" y="201" fill="#efebe4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
        <text x="616.0" y="220.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Simple</text>
        <text x="616.0" y="236.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ui=simple, default</text>
        <rect x="752" y="184" width="144" height="64" rx="6" fill="#0d0b08"/>
        <rect x="752" y="184" width="144" height="64" rx="6" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <rect x="760" y="192" width="32" height="12" rx="2" fill="transparent" stroke="rgba(239,235,228,0.40)" stroke-width="0.8"/>
        <text x="776.0" y="201" fill="#efebe4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
        <text x="824.0" y="220.0" fill="#efebe4" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Advanced</text>
        <text x="824.0" y="236.0" fill="#afaaa3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ui=adv</text>

        <!-- Legend and notes -->
        <line x1="40" y1="336" x2="920" y2="336" stroke="rgba(239,235,228,0.10)" stroke-width="0.8"/>
        <text x="40" y="352" fill="#afaaa3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="368" width="14" height="10" rx="2" fill="rgba(181,138,251,0.10)" stroke="#b58afb" stroke-width="1"/>
        <text x="60" y="376" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Where the data is shown</text>
        <rect x="200" y="368" width="14" height="10" rx="2" fill="#1b1814" stroke="#efebe4" stroke-width="1"/>
        <text x="220" y="376" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">State or mode</text>
        <line x1="312" y1="374" x2="340" y2="374" stroke="#b58afb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="348" y="376" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Main route</text>
        <line x1="424" y1="374" x2="452" y2="374" stroke="#afaaa3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="460" y="376" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Transition</text>
        <line x1="536" y1="374" x2="564" y2="374" stroke="#afaaa3" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="572" y="376" fill="#afaaa3" font-size="8.5" font-family="'Hanken Grotesk', system-ui, sans-serif">Way back</text>
      </svg>
    </div>
  </div>
</body>
</html>
