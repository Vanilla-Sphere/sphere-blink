services:
  - type: web
    name: sphere-blink
    runtime: python
    region: virginia   # next to the SPHEREx bucket in AWS us-east-1
    plan: standard   # 1 CPU, 2 GB (Pro Plus until 2026-11-19, then Pro; lowered to cut cost)
    buildCommand: pip install -r requirements.txt
    # One web process, always: views and progressive fields are tracked in
    # its memory, and it starts SPHEREX_FETCH_PROCS processes of its own for
    # the heavy work. Render sets WEB_CONCURRENCY to the CPU count, which
    # uvicorn would read as "run 4 servers" - each then loads every view
    # again and they answer the progress polls with different states.
    # A deploy stops this server before the next one starts, so it must
    # leave quickly: 3 s for the answers in flight, then it exits (see
    # main._stop_fast). Without this it waited for open connections until
    # the host killed it after 30 s, every deploy.
    startCommand: uvicorn sphereblink.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-graceful-shutdown 3
    healthCheckPath: /api/health
    # A deploy restarts the one server (the disk can belong to one instance
    # only), which takes the site down for a short while and forgets the
    # views being gathered (the viewer waits and retries by itself). Changes that cannot affect the running
    # service do not deploy.
    buildFilter:
      ignoredPaths:
        - docs/**
        - tests/**
        - scripts/**
        - "**/*.md"
        - .github/**
        - render.dev.yaml   # the dev service, see docs/environments.md
    domains:
      - vanillasphere.com
      - www.vanillasphere.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SPHEREX_CACHE_DIR
        value: /var/data/sphereblink
      # Connection string of the measurement database (role blink_service:
      # the viewer reads it, the measurement pipeline writes what it
      # measures). Set it in the Render dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      # Keep these in step with the plan and the disk below: processes = CPUs
      # of the plan, the two disk budgets together = at most 85% of the disk.
      - key: SPHEREX_FETCH_PROCS
        value: "1"
      # Frames kept in the server's memory. On the 8 GB plan 2000 held two
      # 7 x 7 fields at once; on 2 GB 300 keeps the recent small views (wide
      # ones live in files on disk, SPHEREX_SPILL_*), and an older one is
      # read again from the disk.
      - key: SPHEREX_RAM_BUDGET_MB
        value: "300"
      # What the pipeline works on at a time; the rest waits in a queue and
      # is told its position. Measured on 4 CPU, 8 GB (docs/performance.md,
      # "How many jobs at once") and lowered for this plan (1 CPU, 2 GB) on
      # 2026-11-19, measured under that limit (docs/performance.md, "A server
      # with 2 GB"). Views: two cut at a time, each in its share of
      # SPHEREX_CUT_MB, and together no more frames in memory than ACTIVE_MB
      # (frames of wide views are on disk and only pass through; one view is
      # always worked on, whatever its size). Measurements: one. Measure
      # again before raising them or changing the plan.
      # These three and RAM_BUDGET_MB are also rows of the table "settings" of
      # the database, which the service reads twice a minute: change them
      # there, without a deploy (docs/deployment.md, "Settings in the
      # database"). The values here are the ones without a row or without the
      # database, and RAM_BUDGET_MB + ACTIVE_MB + 250 MB per measuring process
      # is the memory the table may hand out in all.
      - key: SPHEREX_ACTIVE_VIEWS
        value: "2"
      - key: SPHEREX_ACTIVE_MB
        value: "300"
      - key: SPHEREX_MEASURE_PROCS
        value: "1"
      # Memory the exposures being cut may take together (a 7 x 7 field then
      # cuts 7 at a time, an 8 arcmin view 64), the epoch images kept for the
      # next request, and the room the mover search waits for (the file cache
      # counted as free).
      - key: SPHEREX_CUT_MB
        value: "250"
      - key: SPHEREX_EPOCH_CACHE_MB
        value: "120"
      - key: SPHEREX_MOVER_MIN_FREE_MB
        value: "700"
      # glibc otherwise keeps one heap per thread and hands little back
      - key: MALLOC_ARENA_MAX
        value: "2"
      # The disk is shared by the frame cache (DISK_BUDGET) and the tiles of
      # the sky photograph (ATLAS_BUDGET): together 28 of its 40 GB.
      - key: SPHEREX_DISK_BUDGET_GB
        value: "16"
      # The photograph behind the sky map (sphereblink/atlas.py): tiles of
      # the 2MASS atlas fetched from the archive once and kept. Orders 0-6
      # (the whole sky at 6.4 arcsec a pixel, the size of a SPHEREx pixel:
      # 65 532 tiles, about 7.2 GB) are fetched after a start and never
      # dropped; the deeper tiles share what is left of the budget, least
      # recently asked for out first. One more order kept would be 29 GB
      # more: the whole atlas is 445 GB and must not be copied.
      - key: SPHEREX_ATLAS_BUDGET_GB
        value: "12"
      - key: SPHEREX_ATLAS_KEEP_ORDER
        value: "6"
      - key: SPHEREX_ATLAS_SEED
        value: "1"
    disk:
      name: cache
      mountPath: /var/data
      sizeGB: 40   # a disk can be made larger, never smaller
