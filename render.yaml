services:
  - type: web
    name: sphere-blink
    runtime: python
    region: virginia   # next to the SPHEREx bucket in AWS us-east-1
    plan: pro plus   # 4 CPU, 8 GB
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sphereblink.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SPHEREX_CACHE_DIR
        value: /var/data/sphereblink
      # Keep these three in step with the plan and the disk below:
      # processes = CPUs of the plan, disk budget = about 80% of the disk.
      # Read-only connection string of the measurement database (role
      # blink_web). Set it in the Render dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      - key: SPHEREX_FETCH_PROCS
        value: "4"
      - key: SPHEREX_RAM_BUDGET_MB
        value: "2500"
      - key: SPHEREX_DISK_BUDGET_GB
        value: "16"
    disk:
      name: cache
      mountPath: /var/data
      sizeGB: 20
