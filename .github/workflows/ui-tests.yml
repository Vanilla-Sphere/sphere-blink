# After a merge, the UI tests of Vanilla-Sphere/sphere-blink-ui-tests run
# against the site that merge deploys (docs/environments.md):
#
#   develop -> https://dev.vanillasphere.com   (the viewer of develop in front
#                                               of the engine of production)
#   main    -> https://vanillasphere.com       (production)
#
# The tests and the way they are run live in that repository (its action.yml);
# this workflow only waits until the site serves the merged commit and then
# calls it. The result is a check on the merge commit here. The suite reads
# only: the cases that start heavy jobs or write measurements are off in CI.
#
# By hand (Actions > ui-tests > Run workflow) it runs against the chosen site
# as it is, without waiting for a deploy.
#
# The other repository is private: it must allow this one to use its action
# (its Settings > Actions > General > Access: "Accessible from repositories in
# the 'Vanilla-Sphere' organization").
name: ui-tests

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      site:
        description: Site under test
        type: choice
        default: dev
        options: [dev, production]
      project:
        description: Project (empty runs both)
        type: choice
        default: ""
        options: ["", desktop, smartphone]
      grep:
        description: Only the tests whose title matches, for example UI-00[1-4]
        type: string
        default: ""

permissions:
  contents: read

# One run per site at a time. A newer merge replaces the run of the one
# before it: the site no longer serves that commit.
concurrency:
  group: ui-tests-${{ github.event_name == 'push' && github.ref_name || inputs.site }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: ${{ (github.event_name == 'push' && github.ref_name == 'main' || inputs.site == 'production') && 'production' || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE: ${{ (github.event_name == 'push' && github.ref_name == 'main' || inputs.site == 'production') && 'https://vanillasphere.com' || 'https://dev.vanillasphere.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit before the push, to see whether the engine is redeployed

      - name: Wait until the site serves this commit
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: sh scripts/wait_for_deploy.sh "$SITE" "${{ github.ref_name == 'main' && 'engine' || 'static' }}"

      - name: UI tests
        uses: Vanilla-Sphere/sphere-blink-ui-tests@main
        with:
          base-url: ${{ env.SITE }}/
          project: ${{ inputs.project }}
          grep: ${{ inputs.grep }}
          report-name: ui-tests-report-${{ (github.event_name == 'push' && github.ref_name == 'main' || inputs.site == 'production') && 'production' || 'dev' }}
