# Before a merge, the UI tests of Vanilla-Sphere/sphere-blink-ui-tests run
# against the commit of the pull request (docs/environments.md):
#
#   pull request to develop or main -> the service of that commit, started
#                                      inside this job
#                                      (scripts/start_local_site.sh) and
#                                      reached, inside this job only, under
#                                      the name of the live site
#
# The rule (owner, 2026-11-16): tests run before a deploy, never after it,
# and never against production or any site hosted on Render. Every byte a
# deployed site sends is paid for, and a run opens hundreds of pages and
# downloads about a third of a gigabyte of pictures. So nothing runs on a
# push (a push to main is the deploy), and no input of this workflow can
# point the tests at a deployed site.
#
# The tests are written for the address of the live site: they compare the
# links of the page with https://vanillasphere.com and leave out the cases
# that start heavy jobs there. So the runner's /etc/hosts sends that name,
# and every other name of our deployed sites, to 127.0.0.1, where the server
# of this job listens on port 443 with a certificate made for the run. A
# request for a deployed site can then only reach this machine: nothing of
# a run reaches Render.
#
# The tests and the way they are run live in that repository (its
# action.yml); this workflow only starts the site and calls it. The result is
# a check on the pull request. The suite reads only: the cases that start
# heavy jobs or write measurements are off in CI.
#
# By hand (Actions > ui-tests > Run workflow) it runs the same way, against
# the server of the chosen branch inside the job.
#
# The other repository is private: it must allow this one to use its action
# (its Settings > Actions > General > Access: "Accessible from repositories in
# the 'Vanilla-Sphere' organization").
name: ui-tests

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      project:
        description: Project (empty runs both)
        type: choice
        default: ""
        options: ["", desktop, smartphone]
      grep:
        description: Only the tests whose title matches, for example UI-00[1-4]
        type: string
        default: ""

permissions:
  contents: read

# One run per pull request (or branch, by hand) at a time. A newer push to
# the pull request replaces the run of the one before it.
concurrency:
  group: ui-tests-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: before merge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The address of production, which in this job is this machine: see
      # the hosts step below
      SITE: https://vanillasphere.com
    steps:
      - uses: actions/checkout@v4

      - name: Python of the service
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Packages of the service
        run: |
          pip install -r requirements.txt
          # certutil: the browser of the tests has to trust the certificate
          # of the site started below
          command -v certutil >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q libnss3-tools; }

      # What the server fetched from the archive in earlier runs (frames of
      # the views the tests open, tiles of the sky photograph, names), so a
      # run does not read it all again. A cache is never changed once saved,
      # hence a new key each run and the newest one restored.
      - name: Frames and tiles of earlier runs
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sphereblink-cache
          key: ui-tests-site-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ui-tests-site-cache-v1-

      # From here on every name of our deployed sites is this machine, for
      # every program of the job: a test that names one of them reaches the
      # server below (or fails), never Render. Ports from 443 up may be
      # opened without being root.
      - name: The names of the deployed sites point at this job
        run: |
          names="vanillasphere.com www.vanillasphere.com dev.vanillasphere.com sphere-blink-bsfz.onrender.com sphere-blink-dev-atkl.onrender.com"
          echo "127.0.0.1 $names" | sudo tee -a /etc/hosts >/dev/null
          sudo sysctl -q -w net.ipv4.ip_unprivileged_port_start=443
          for n in $names; do
            test "$(getent hosts "$n" | awk '{print $1}')" = 127.0.0.1 || { echo "::error::$n does not lead to this machine"; exit 1; }
          done

      - name: Start the site in this job
        env:
          SPHEREX_CACHE_DIR: ${{ runner.temp }}/sphereblink-cache
          SPHEREX_DISK_BUDGET_GB: "2"
          SITE_HTTPS: "1"
          SITE_NAME: vanillasphere.com
          PORT: "443"
          SITE_CERTS: ${{ runner.temp }}/local-site-certs
          SITE_LOG: ${{ runner.temp }}/local-site.log
          SITE_PID: ${{ runner.temp }}/local-site.pid
        run: |
          sh scripts/start_local_site.sh
          # The tests also fetch with Node, which has its own list of
          # certificate authorities.
          echo "NODE_EXTRA_CA_CERTS=$SITE_CERTS/ca.pem" >> "$GITHUB_ENV"
          # The name has to lead to the server above, not to Render: only
          # the certificate of this run is accepted here, and the server
          # must be the process just started.
          here=$(curl -fsS -m 20 --cacert "$SITE_CERTS/ca.pem" "$SITE/api/health")
          if ! echo "$here" | grep -Eq "\"instance\" *: *\"$(cat "$SITE_PID")-"; then
            echo "::error title=Not the site of this job::$SITE does not lead to the server started in this job."
            exit 1
          fi
          {
            echo "**$SITE in this run is the server started inside the job** from commit \`$(git rev-parse --short=12 HEAD)\`"
            echo "(the name points at 127.0.0.1 here). Nothing was asked of the deployed site."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: UI tests
        uses: Vanilla-Sphere/sphere-blink-ui-tests@main
        with:
          base-url: ${{ env.SITE }}/
          project: ${{ inputs.project }}
          grep: ${{ inputs.grep }}
          report-name: ui-tests-report

      - name: Stop the site and show the end of its log
        if: always()
        env:
          SITE_LOG: ${{ runner.temp }}/local-site.log
          SITE_PID: ${{ runner.temp }}/local-site.pid
        run: |
          sh scripts/start_local_site.sh stop
          du -sh "${{ runner.temp }}/sphereblink-cache" || true
          echo "Warnings and errors of the server (requests that went well left out; how often, the line):"
          grep -v '^INFO: .* HTTP/1.1" [23]' "$SITE_LOG" | sed -E 's/^(INFO: +)[0-9.]+:[0-9]+ - /\1/' | cut -c1-240 | sort | uniq -c | sort -rn | head -30 || true

      - name: Keep the frames and tiles for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sphereblink-cache
          key: ui-tests-site-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
