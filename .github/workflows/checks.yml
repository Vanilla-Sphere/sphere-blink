# What a change has to pass on its way to production (docs/environments.md):
# the tests, the branch names, and the rule that main only takes develop.
name: checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the version of render.yaml
          cache: pip
      - run: pip install -r requirements.txt pytest pyyaml
      - run: python -m pytest -q
        env:
          SPHEREX_AUTO_MEASURE: "0"

  branch:
    # Work branches are named after the kind of change: feat/, fix/ or
    # chore/. main is production and only ever takes develop.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: The branch may be merged here
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = main ]; then
            case "$HEAD_REF" in
              develop) echo "ok: develop is promoted to main" ;;
              *) echo "::error::main only takes develop. Change the base of this pull request to develop. See docs/environments.md."
                 exit 1 ;;
            esac
          else
            case "$HEAD_REF" in
              feat/*|fix/*|chore/*|main) echo "ok: $HEAD_REF" ;;
              *) echo "::error::Name the branch feat/..., fix/... or chore/... (this one is $HEAD_REF). See docs/environments.md."
                 exit 1 ;;
            esac
          fi
